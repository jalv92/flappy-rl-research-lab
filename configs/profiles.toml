# Research budgets. Every value is a hard cap enforced by the trainer or the research controller.
# Defaults are conservative for a Windows 11 / WSL2 workstation with an RTX 4070 Ti (12 GB) and 32 GB RAM:
# each trainer is single-threaded, ~1.4 GB RSS, and (measured, see `python -m scripts.lab bench`) faster on
# CPU than on CUDA for these small MLPs, so the GPU budget only matters if a run opts into device="cuda".

[limits]
max_concurrent = 4          # trainer processes alive at once (global, API + research)
max_memory_mb = 4096        # per trainer process (RSS)
max_gpu_mem_mb = 2048       # per trainer process when CUDA is used
max_disk_mb = 5120          # experiments/ + checkpoints/ together
run_wall_seconds = 1800     # per training run
early_stop_patience = 0     # N consecutive validation evals at the score cap ends a run early; 0 = off
checkpoint_every = 25000    # env steps between resumable checkpoints

[profiles.quick_smoke]
description = "Wiring check: one tiny experiment. Not evidence of anything."
steps = 4000
seeds = 2
eval_every = 2000
eval_episodes = 4
max_experiments = 1
session_wall_seconds = 600
confirm = false
record_status = false       # its outcome never changes a hypothesis' status

[profiles.baseline_benchmark]
description = "Reference curves for DQN, PPO and the xdqn control."
steps = 150000
seeds = 5
eval_every = 10000
eval_episodes = 16
max_experiments = 0
session_wall_seconds = 3600
confirm = false

[profiles.experimental_screening]
description = "Cheap exploratory screening of untested hypotheses (3 seeds). Exploratory only."
steps = 100000
seeds = 3
eval_every = 10000
eval_episodes = 16
max_experiments = 4
session_wall_seconds = 3600
confirm = false

[profiles.full_research]
description = "Screening plus follow-up stages for hypotheses that earn them."
steps = 150000
seeds = 5
eval_every = 10000
eval_episodes = 16
max_experiments = 8
session_wall_seconds = 7200
confirm = true

[profiles.final_confirmation]
description = "Confirmatory runs only: fresh seeds, full budget, held-out test and out-of-distribution scenarios."
steps = 150000
seeds = 8
eval_every = 10000
eval_episodes = 16
max_experiments = 2
session_wall_seconds = 7200
confirm = true
confirm_only = true
